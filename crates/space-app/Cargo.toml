[package]
name = "space-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Disk space scanner with radial, treemap, sunburst and cascade views"

[[bin]]
name = "space-scanner"
path = "src/main.rs"

[dependencies]
space-core = { workspace = true }
space-clean = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
crossbeam-channel = { workspace = true }
sysinfo = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex-automata = { workspace = true }
png = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSSharingService", "NSView", "NSWindow"] }
