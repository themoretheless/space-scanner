[workspace]
resolver = "2"
members = ["crates/space-core", "crates/space-app", "crates/space-cli", "crates/space-clean", "crates/space-mcp", "crates/space-tools"]
default-members = ["crates/space-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
space-core = { path = "crates/space-core" }
space-clean = { path = "crates/space-clean" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
blake3 = "1"
directories = "5"
thiserror = "2"
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
humansize = "2"
unicode-normalization = "0.1"
zstd = { version = "0.13", default-features = false }
sysinfo = "0.33"
trash = "5"
clap = { version = "4", features = ["derive"] }
airbug-bench = { git = "https://github.com/themoretheless/airbug", branch = "release", package = "airbug-bench", features = ["macros"] }
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "persistence",
] }
egui = "0.31"
rfd = "0.15"
serde_json = "1"
