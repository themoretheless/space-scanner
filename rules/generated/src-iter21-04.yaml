  description: Nixpkgs leftover pname pam on windows (wave 21). Not /nix/store or
    configs.
  category: caches
  platform: windows
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "%LOCALAPPDATA%/pam/Cache"
  - "%LOCALAPPDATA%/pam/Logs"
  delete_mode: contents
  max_depth: 6
