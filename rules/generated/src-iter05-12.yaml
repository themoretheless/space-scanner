  description: Nixpkgs leftover pname chroGPS on linux (wave 5). Not /nix/store or
    configs.
  category: caches
  platform: linux
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.cache/chroGPS"
  - "$XDG_CACHE_HOME/chroGPS"
  delete_mode: contents
  max_depth: 6
