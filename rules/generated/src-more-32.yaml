  description: User logs/cache leftover for AUR package bitlbee-mastodon-git (second
    slice).
  category: logs
  platform: linux
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.cache/bitlbee-mastodon-git/logs"
  - "$HOME/.local/share/bitlbee-mastodon-git/logs"
  - "$XDG_CACHE_HOME/bitlbee-mastodon-git/logs"
  delete_mode: contents
  max_depth: 6
