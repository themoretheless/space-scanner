  description: Second Nixpkgs slice for MOTE on Windows.
  category: caches
  platform: windows
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "%LOCALAPPDATA%/MOTE/Cache"
  - "%LOCALAPPDATA%/MOTE/Logs"
  delete_mode: contents
  max_depth: 6
