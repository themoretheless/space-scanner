  description: mixed catalogs leftover name keypirinha on linux (wave 84). Caches/logs
    only, not configs.
  category: caches
  platform: linux
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.cache/keypirinha"
  - "$XDG_CACHE_HOME/keypirinha"
  delete_mode: contents
  max_depth: 6
