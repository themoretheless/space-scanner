  description: XDG cache directory named after Homebrew formula lmdb (common Linux/macOS
    tool cache layout).
  category: caches
  platform: linux
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.cache/lmdb"
  - "$XDG_CACHE_HOME/lmdb"
  delete_mode: contents
  max_depth: 6
