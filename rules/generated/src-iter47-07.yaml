  description: Debian leftover name ruby-money on windows (wave 47). Caches/logs only,
    not configs.
  category: caches
  platform: windows
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "%LOCALAPPDATA%/ruby-money/Cache"
  - "%LOCALAPPDATA%/ruby-money/Logs"
  delete_mode: contents
  max_depth: 6
