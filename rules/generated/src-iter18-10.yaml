  description: Nixpkgs leftover pname monad-journal on windows (wave 18). Not /nix/store
    or configs.
  category: caches
  platform: windows
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "%LOCALAPPDATA%/monad-journal/Cache"
  - "%LOCALAPPDATA%/monad-journal/Logs"
  delete_mode: contents
  max_depth: 6
