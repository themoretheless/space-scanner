  description: User logs/cache leftover for AUR package borealis (second slice).
  category: logs
  platform: linux
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.cache/borealis/logs"
  - "$HOME/.local/share/borealis/logs"
  - "$XDG_CACHE_HOME/borealis/logs"
  delete_mode: contents
  max_depth: 6
