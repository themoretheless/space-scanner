  description: AUR leftover name linsys2 on windows (wave 62). Caches/logs only, not
    configs.
  category: caches
  platform: windows
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "%LOCALAPPDATA%/linsys2/Cache"
  - "%LOCALAPPDATA%/linsys2/Logs"
  delete_mode: contents
  max_depth: 6
