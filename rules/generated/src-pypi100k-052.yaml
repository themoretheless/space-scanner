  description: Inferred cache path for PyPI project agiwo; package presence and cache
    layout are unverified. Report only; preserves all files, configs and environments.
  category: caches
  platform: macos
  kind: cache
  risk: report-only
  report_only: true
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/agiwo"
  delete_mode: contents
  max_depth: 6
  tags:
  - pypi
  - catalog-probe
  - unverified-path
