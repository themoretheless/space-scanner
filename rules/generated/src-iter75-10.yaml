  description: AUR leftover name sardi-icons on windows (wave 75). Caches/logs only,
    not configs.
  category: caches
  platform: windows
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "%LOCALAPPDATA%/sardi-icons/Cache"
  - "%LOCALAPPDATA%/sardi-icons/Logs"
  delete_mode: contents
  max_depth: 6
