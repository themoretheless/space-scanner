  description: Nixpkgs leftover pname pstree on macos (wave 22). Not /nix/store or
    configs.
  category: caches
  platform: macos
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/pstree"
  - "$HOME/Library/Logs/pstree"
  delete_mode: contents
  max_depth: 6
