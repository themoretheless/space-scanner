  description: XDG cache for Nixpkgs package Familias (nixos-unstable packages.json).
    Not /nix/store.
  category: caches
  platform: linux
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.cache/Familias"
  - "$XDG_CACHE_HOME/Familias"
  - "$HOME/.local/share/Familias/cache"
  delete_mode: contents
  max_depth: 6
- id: nix-win-familias
  name: Nixpkgs Familias Windows cache
  description: AppData cache for Nixpkgs package Familias (used on Windows via nix).
    Not user documents.
  category: caches
  platform: windows
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "%LOCALAPPDATA%/Familias/Cache"
  - "%APPDATA%/Familias/Cache"
  - "%LOCALAPPDATA%/Familias/logs"
  - "%TEMP%/Familias"
  delete_mode: contents
  max_depth: 6
- id: nix-mac-families
