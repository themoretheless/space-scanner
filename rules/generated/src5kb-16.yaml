  description: Homebrew cask mycard typical leftover caches/logs (MyCard). Not Application
    Support documents.
  category: app-cache
  platform: macos
  risk: low
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/mycard"
  - "$HOME/Library/Caches/MyCard"
  - "$HOME/Library/Logs/mycard"
  - "$HOME/Library/Logs/MyCard"
  - "$HOME/Library/Saved Application State/mycard.savedState"
  delete_mode: contents
  max_depth: 6
