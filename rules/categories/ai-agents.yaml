---
pack: ai-agents
description: Caches, scratch temps, shared build targets, VM bundles, and detached worktrees left by AI coding agents and desktop AI assistants.
rules:
- id: ai-codex-scratch-macos
  name: OpenAI Codex scratch temp and cache
  description: Removes regenerable Codex temp/cache directories (~/.codex/tmp, ~/.codex/.tmp, ~/.codex/cache); auth.json, config.toml, and active sessions are preserved.
  category: ai-agents
  platform: macos
  risk: low
  kind: temp
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/.codex/tmp"
  - "$HOME/.codex/.tmp"
  - "$HOME/.codex/cache"
  delete_mode: contents
  max_depth: 5
  tags: [ai-agents, codex, temp]

- id: ai-codex-scratch-linux
  name: OpenAI Codex scratch temp and cache
  description: Removes regenerable Codex temp/cache directories (~/.codex/tmp, ~/.codex/.tmp, ~/.codex/cache); auth.json, config.toml, and active sessions are preserved.
  category: ai-agents
  platform: linux
  risk: low
  kind: temp
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/.codex/tmp"
  - "$HOME/.codex/.tmp"
  - "$HOME/.codex/cache"
  delete_mode: contents
  max_depth: 5
  tags: [ai-agents, codex, temp]

- id: ai-codex-scratch-windows
  name: OpenAI Codex scratch temp and cache
  description: Removes regenerable Codex temp/cache directories; auth.json, config.toml, and active sessions are preserved.
  category: ai-agents
  platform: windows
  risk: low
  kind: temp
  default_enabled: true
  min_age_days: 1
  paths:
  - "%USERPROFILE%/.codex/tmp"
  - "%USERPROFILE%/.codex/.tmp"
  - "%USERPROFILE%/.codex/cache"
  delete_mode: contents
  max_depth: 5
  tags: [ai-agents, codex, temp]

- id: ai-codex-desktop-cache-macos
  name: OpenAI Codex Desktop Electron caches and logs
  description: Removes Codex Desktop HTTP, Code, GPU, Dawn caches and logs; active sessions and settings are preserved.
  category: ai-agents
  platform: macos
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 0
  paths:
  - "$HOME/Library/Caches/Codex"
  - "$HOME/Library/Application Support/Codex/Cache"
  - "$HOME/Library/Application Support/Codex/Code Cache"
  - "$HOME/Library/Application Support/Codex/GPUCache"
  - "$HOME/Library/Application Support/Codex/DawnGraphiteCache"
  - "$HOME/Library/Application Support/Codex/DawnWebGPUCache"
  - "$HOME/Library/Application Support/Codex/GraphiteDawnCache"
  - "$HOME/Library/Logs/Codex"
  - "$HOME/Library/Logs/com.openai.codex"
  delete_mode: contents
  max_depth: 5
  tags: [ai-agents, codex, electron, cache]

- id: ai-codex-desktop-cache-windows
  name: OpenAI Codex Desktop Electron caches
  description: Removes Codex Desktop Electron caches; active sessions and settings are preserved.
  category: ai-agents
  platform: windows
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 0
  paths:
  - "%APPDATA%/Codex/Cache"
  - "%APPDATA%/Codex/Code Cache"
  - "%APPDATA%/Codex/GPUCache"
  - "%LOCALAPPDATA%/Codex/Cache"
  delete_mode: contents
  max_depth: 5
  tags: [ai-agents, codex, electron, cache]

- id: ai-codex-worktrees-macos
  name: OpenAI Codex detached worktrees
  description: Detached git worktrees created by Codex (~/.codex/worktrees). Review before trashing to verify no unmerged changes remain.
  category: ai-agents
  platform: macos
  risk: medium
  kind: dev
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/.codex/worktrees"
  exclude_globs:
  - ".metadata_never_index"
  delete_mode: contents
  max_depth: 3
  tags: [ai-agents, codex, worktree]

