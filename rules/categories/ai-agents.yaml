- id: ai-antigravity-electron-caches-linux
  name: Antigravity Desktop Electron caches
  description: Regenerable Electron HTTP, Code, and GPU caches for Antigravity Desktop; ~/.gemini/antigravity state and brain artifacts are never touched.
  category: ai-agents
  platform: linux
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/.config/Antigravity/Cache"
  - "$HOME/.config/Antigravity/Code Cache"
  - "$HOME/.config/Antigravity/GPUCache"
  delete_mode: contents
  max_depth: 4
  tags: [ai-agents, antigravity, electron, cache]

- id: ai-antigravity-electron-caches-windows
  name: Antigravity Desktop Electron caches
  description: Regenerable Electron HTTP, Code, and GPU caches for Antigravity Desktop; ~/.gemini/antigravity state and brain artifacts are never touched.
  category: ai-agents
  platform: windows
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 1
  paths:
  - "%APPDATA%/Antigravity/Cache"
  - "%APPDATA%/Antigravity/Code Cache"
  - "%APPDATA%/Antigravity/GPUCache"
  delete_mode: contents
  max_depth: 4
  tags: [ai-agents, antigravity, electron, cache]

- id: ai-perplexity-mlx-macos
  name: Perplexity PythonMLX runtime and cache
  description: Perplexity local PythonMLX runtime and model artifacts; re-downloaded on demand if removed.
  category: ai-agents
  platform: macos
  risk: medium
  kind: models
  default_enabled: true
  min_age_days: 3
  paths:
  - "$HOME/Library/Application Support/ai.perplexity.macv3/PythonMLX"
  delete_mode: contents
  max_depth: 4
  tags: [ai-agents, perplexity, ml]
