- id: ai-claude-project-target-macos
  name: Claude Code project shared build targets and caches
  description: Removes regenerable .claude/target, .claude/target-*, and .claude/cache directories inside source repositories; source code and worktrees are preserved.
  category: ai-agents
  platform: macos
  risk: low
  kind: dev
  default_enabled: true
  min_age_days: 0
  paths:
  - "$HOME/Projects"
  - "$HOME/Source"
  - "$HOME/Sources"
  - "$HOME/Developer"
  - "$HOME/src"
  - "$HOME/repos"
  - "$HOME/work"
  - "$HOME/workspace"
  - "$HOME/Documents/Projects"
  - "$HOME/Documents/Source"
  - "$HOME/Documents/Sources"
  - "$HOME/RiderProjects"
  - "$HOME/IdeaProjects"
  - "$HOME/WebstormProjects"
  include_globs:
  - "**/.claude/target"
  - "**/.claude/target-*"
  - "**/.claude/cache"
  exclude_globs:
  - "**/.git/**"
  - "**/node_modules/**"
  required_ancestor_globs:
  - ".git"
  - "Cargo.toml"
  - "package.json"
  - "pyproject.toml"
  - "go.mod"
  - "CMakeLists.txt"
  - "*.sln"
  - "*.slnx"
  match_directories: true
  delete_mode: contents
  max_depth: 8
  tags: [ai-agents, claude, build-output, project]

