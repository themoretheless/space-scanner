  description: Archived Codex sessions, visualizations, artifacts, generated images, and computer-use scratch files; live sessions and SQLite stores are preserved.
  category: ai-agents
  platform: macos
  risk: medium
  kind: leftovers
  default_enabled: true
  min_age_days: 3
  paths:
