---
pack: mobile-embedded
description: "iOS/Android/Flutter/React Native mobile SDK caches and embedded/IoT/robotics toolchain caches; source projects and keystore credentials are preserved."
rules:
- id: me-xcode-previews-macos
  name: "Xcode SwiftUI Previews simulators"
  description: "Removes regenerable Xcode SwiftUI Previews simulators; projects, signing identities, and provisioning profiles are preserved."
  category: mobile-embedded
  platform: macos
  risk: medium
  kind: dev
  default_enabled: true
  min_age_days: 7
  paths:
  - "$HOME/Library/Developer/Xcode/UserData/Previews/Simulator Devices"
  delete_mode: contents
  max_depth: 5
  tags: [mobile-embedded, xcode, ios]

