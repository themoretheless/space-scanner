---
pack: caches
description: 'Category pack: caches (112 rules). Add sibling YAML files under rules/categories/
  to extend.'
rules:
- id: cont-callservicesd-caches
  name: callservicesd residual caches (medium careful)
  description: telephonyutilities callservicesd and callintelligenced regenerable
    caches only, not CallHistoryDB.
  category: caches
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Group Containers/group.com.apple.telephonyutilities.callservicesd/Library/Caches"
  - "$HOME/Library/Application Support/com.apple.callintelligenced"
  - "$HOME/Library/Caches/com.apple.callservicesd"
  - "$HOME/Library/Containers/com.apple.calls.PhoneAppIntentsExtension/Data/Library/Caches"
  - "$HOME/Library/Containers/com.apple.calls.PhoneAppIntentsExtension/Data/tmp"
  delete_mode: contents
  max_depth: 5
- id: cont-handoff-useractivityd-caches
  name: Handoff useractivityd group caches
  description: Regenerable Caches/Application Support under useractivityd group (Handoff
    activity metadata), not the shared-pasteboard tree.
  category: caches
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Group Containers/group.com.apple.coreservices.useractivityd/Library/Caches"
  - "$HOME/Library/Group Containers/group.com.apple.coreservices.useractivityd/Library/Application
    Support"
  - "$HOME/Library/Containers/com.apple.AirDrop-Handoff-Settings.extension/Data/Library/Caches"
  - "$HOME/Library/Containers/com.apple.AirDrop-Handoff-Settings.extension/Data/tmp"
  - "$HOME/Library/Containers/com.apple.settings-intents.AirDropHandoffIntents/Data/Library/Caches"
  - "$HOME/Library/Containers/com.apple.settings-intents.AirDropHandoffIntents/Data/tmp"
  delete_mode: contents
  max_depth: 5
  exclude_globs:
  - "**/shared-pasteboard/**"
- id: cont-icloud-photos-agent-residual
  name: iCloud Photos agent caches (not library)
  description: photolibraryd, mstreamd, moments, CloudPhotosConfiguration agent caches
    only. Never Photos Library.photoslibrary or File Provider Storage originals.
  category: caches
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Containers/com.apple.photolibraryd/Data/Library/Caches"
  - "$HOME/Library/Containers/com.apple.mediastream.mstreamd/Data/Library/HTTPStorages"
  - "$HOME/Library/Containers/com.apple.mediastream.mstreamd/Data/Library/MediaStream"
  - "$HOME/Library/Containers/com.apple.CloudPhotosConfiguration/Data/Library/Caches"
  - "$HOME/Library/Containers/com.apple.CloudPhotosConfiguration/Data/tmp"
  - "$HOME/Library/Group Containers/group.com.apple.photolibraryd.private/Library/Caches"
  - "$HOME/Library/Group Containers/group.com.apple.moments/Library/Caches"
  - "$HOME/Library/Group Containers/group.com.apple.moments/tmp"
  - "$HOME/Library/Caches/CloudKit/com.apple.cloudphotod"
  delete_mode: contents
  max_depth: 6
  exclude_globs:
  - "**/*.photoslibrary/**"
  - "**/File Provider Storage/**"
  - "**/moments.sqlite*"
  - "**/Photos.sqlite*"
- id: cont-pasteboard-spotlight-history
  name: CoreSpotlight PasteboardHistory residual
  description: Spotlight PasteboardHistory metadata residual related to clipboard
    indexing.
  category: caches
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Metadata/CoreSpotlight/PasteboardHistory"
  delete_mode: contents
  max_depth: 4
- id: cont-proactive-duet-residual
  name: Proactive and Duet residual streams/metrics
  description: DuetExpertCenter residual subtrees (streams, metrics, feedback, caches)
    and proactive reporting residual. Parent DuetExpertCenter already cleanable in
    apple-extended; this documents residual depth and medium privacy stance.
  category: caches
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/DuetExpertCenter/streams"
  - "$HOME/Library/DuetExpertCenter/metrics"
  - "$HOME/Library/DuetExpertCenter/feedback"
  - "$HOME/Library/DuetExpertCenter/caches"
  - "$HOME/Library/Containers/com.apple.proactive.AppleIntelligenceReportingSELFIngestor/Data/Library/Caches"
  - "$HOME/Library/Containers/com.apple.proactive.AppleIntelligenceReportingSELFIngestor/Data/tmp"
  - "$HOME/Library/Containers/com.apple.DEC.AppPredictionInternal.DiagnosticExtension/Data/Library/Caches"
  - "$HOME/Library/Containers/com.apple.DEC.AppPredictionInternal.DiagnosticExtension/Data/tmp"
  delete_mode: contents
  max_depth: 6
- id: cont-push-usernotifications-residual
  name: Push and UserNotifications residual caches
  description: UserNotifications group caches, Notification Center UI residual, AOSPushRelay
    HTTPStorages.
  category: caches
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Group Containers/group.com.apple.UserNotifications/Library/Caches"
  - "$HOME/Library/Containers/com.apple.notificationcenterui/Data/Library/Caches"
  - "$HOME/Library/Containers/com.apple.notificationcenterui/Data/tmp"
  - "$HOME/Library/HTTPStorages/com.apple.AOSPushRelay"
  - "$HOME/Library/Caches/com.apple.UserNotifications"
  - "$HOME/Library/Caches/com.apple.apsd"
  delete_mode: contents
  max_depth: 5
  exclude_globs:
  - "**/*.binarycookies"
- id: cont-sharingd-rapport-residual
  name: sharingd and rapportd Continuity residual caches
  description: Nearby Continuity transport residual under sharingd and rapportd group
    Library/Caches only.
  category: caches
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Group Containers/group.com.apple.sharingd/Library/Caches"
  - "$HOME/Library/Group Containers/group.com.apple.rapportd/Library/Caches"
  - "$HOME/Library/Group Containers/group.com.apple.rapportd/Library/Application Support"
  - "$HOME/Library/Caches/com.apple.sharingd"
  - "$HOME/Library/Caches/com.apple.rapportd"
  delete_mode: contents
  max_depth: 5
  exclude_globs:
  - "**/AirDropIDMSDB/**"
  - "**/RPIdentitySyncCache.plist"
- id: cont-sidecar-screen-continuity
  name: Sidecar and Screen Continuity caches
  description: Screen Continuity / Sidecar / iPhone Mirroring related container and
