  - "$HOME/Library/Caches/com.apple.ScreenContinuity"
  - "$HOME/Library/Caches/com.apple.sidecar"
  delete_mode: contents
  max_depth: 6
- id: cont-siri-suggestions-residual
  name: Siri suggestions residual caches
  description: Siri suggestions group Library/Caches residual and related suggestion
