---
pack: ml-models
description: 'Category pack: ml-models (19 rules). Add sibling YAML files under rules/categories/
  to extend.'
rules:
- id: ml-clip-openclip
  name: CLIP / OpenCLIP caches
  description: ''
  category: ml-models
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/.cache/clip"
  - "$HOME/.cache/open_clip"
  - "$XDG_CACHE_HOME/clip"
  - "$XDG_CACHE_HOME/open_clip"
  delete_mode: contents
  max_depth: 6
- id: ml-detectron-fairseq-paddle
  name: Detectron2, Fairseq, Paddle caches
  description: ''
  category: ml-models
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/.torch/iopath_cache"
  - "$HOME/.cache/detectron2"
  - "$HOME/.cache/fairseq"
  - "$HOME/.paddleocr"
  - "$HOME/.paddlenlp"
  - "$HOME/.cache/paddle"
  delete_mode: contents
  max_depth: 6
- id: ml-diffusers-cache
  name: Diffusers / diffusion model cache extras
  description: ''
  category: ml-models
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
