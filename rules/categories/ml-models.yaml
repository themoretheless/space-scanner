  name: Sentence-Transformers cache
  description: ''
  category: ml-models
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/.cache/sentence-transformers"
  - "$HOME/.cache/torch/sentence_transformers"
  - "$XDG_CACHE_HOME/sentence-transformers"
