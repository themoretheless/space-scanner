  max_depth: 6
- id: photo-topaz-models-medium
  name: Topaz models medium opt-in (user Library only)
  description: Same model trees as report rule but medium risk opt-in for explicit
    reclaim after report.
  category: ml-models
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 90
  paths:
  - "$HOME/Library/Application Support/Topaz Labs LLC/models"
  - "$HOME/Library/Application Support/Topaz Labs/models"
  - "$HOME/Library/Application Support/Topaz Photo AI/models"
  - "$HOME/Library/Application Support/Topaz Gigapixel AI/models"
  - "$HOME/Library/Application Support/Topaz Video AI/models"
  - "$HOME/Library/Application Support/Topaz DeNoise AI/models"
  delete_mode: contents
  max_depth: 8
- id: photo-topaz-models-report
  name: Topaz AI models (report-only / medium)
  description: Downloaded AI model packs for Photo AI, Gigapixel, Video AI. Large
    re-downloads; report-only by default.
  category: ml-models
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 60
  paths:
  - "$HOME/Library/Application Support/Topaz Labs LLC"
  - "$HOME/Library/Application Support/Topaz Labs"
  - "$HOME/Library/Application Support/Topaz Photo AI"
  - "$HOME/Library/Application Support/Topaz Gigapixel AI"
  - "$HOME/Library/Application Support/Topaz Video AI"
  - "$HOME/Library/Application Support/Topaz DeNoise AI"
  delete_mode: contents
  max_depth: 10
  include_globs:
  - "**/models/**"
  - "**/Models/**"
  - "**/model/**"
  - "**/*.onnx"
  - "**/*.mlmodel*"
  - "**/*.tza"
  - "**/*.tzm"
  exclude_globs:
  - "**/coreMLCache/**"
  - "**/Logs/**"
  - "**/Cache/**"
  - "**/Caches/**"
  - "**/Preferences/**"
  - "**/settings/**"
  report_only: true
