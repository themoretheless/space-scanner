---
pack: creative-cad
description: "Video editors, 3D/DCC suites, CAD tools, and 3D printer slicers caches and logs; source projects, media files, and presets are preserved."
rules:
- id: cc-insta360-studio-macos
  name: "Insta360 Studio preview cache and logs"
  description: "Removes regenerable Insta360 Studio previewer_cache_nle, cut_cache, and logs; source video files and projects are preserved."
  category: creative-cad
  platform: macos
  risk: low
  kind: media
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/Library/Application Support/Insta360/Insta360 Studio/previewer_cache_nle"
  - "$HOME/Library/Application Support/Insta360/Insta360 Studio/log"
  - "$HOME/Library/Application Support/Insta360/Insta360 Studio/cut_cache"
  - "$HOME/Library/Caches/com.insta360.studio"
  delete_mode: contents
  max_depth: 5
  tags: [creative-cad, video, cache]

