---
pack: dev
description: 'Category pack: dev (108 rules). Add sibling YAML files under rules/categories/
  to extend.'
rules:
- id: app-node-gyp-cache
  name: node-gyp cache
  description: node-gyp downloaded headers and build cache.
  category: dev
  platform: any
  risk: low
  default_enabled: true
  min_age_days: 30
  paths:
  - "$HOME/Library/Caches/node-gyp"
  - "$HOME/.cache/node-gyp"
  - "%LOCALAPPDATA%/node-gyp"
  delete_mode: contents
  max_depth: 4
- id: app-playwright-browsers
  name: Playwright browser cache (report-only)
  description: Playwright-downloaded browser binaries; can be re-fetched with npx
