  platform: any
  risk: report-only
  default_enabled: false
  min_age_days: 30
  paths:
  - "$HOME/Library/Caches/ms-playwright"
  - "$HOME/.cache/ms-playwright"
  delete_mode: path
  max_depth: 2
  report_only: true
