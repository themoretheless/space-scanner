---
pack: messengers
description: "Messaging, video conferencing, and email desktop caches and logs; accounts, keys, and local message databases are preserved."
rules:
- id: msg-telegram-media-cache-macos
  name: "Telegram Desktop user_data media cache"
  description: "Removes regenerable Telegram Desktop cache and media_cache folders inside tdata/user_data; auth keys, sessions, and saved downloads are preserved."
  category: messengers
  platform: macos
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/Library/Application Support/Telegram Desktop/tdata/user_data/cache"
  - "$HOME/Library/Application Support/Telegram Desktop/tdata/user_data/media_cache"
  - "$HOME/Library/Caches/ru.keepcoder.Telegram"
  - "$HOME/Library/Containers/ru.keepcoder.Telegram/Data/Library/Caches"
  delete_mode: contents
  max_depth: 5
  tags: [messengers, messenger, telegram]

- id: msg-telegram-media-cache-linux
  name: "Telegram Desktop user_data media cache"
  description: "Removes regenerable Telegram Desktop cache and media_cache folders; auth keys and sessions are preserved."
  category: messengers
  platform: linux
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/.local/share/TelegramDesktop/tdata/user_data/cache"
  - "$HOME/.local/share/TelegramDesktop/tdata/user_data/media_cache"
  - "$HOME/.cache/TelegramDesktop"
  delete_mode: contents
  max_depth: 5
  tags: [messengers, messenger, telegram]

- id: msg-telegram-media-cache-windows
  name: "Telegram Desktop user_data media cache"
  description: "Removes regenerable Telegram Desktop cache and media_cache folders; auth keys and sessions are preserved."
