  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Application Support/Arc/User Data"
  delete_mode: contents
  max_depth: 5
  include_globs:
  - "**/DawnGraphiteCache/**"
  - "**/DawnWebGPUCache/**"
  - "**/GPUPersistentCache/**"
- id: macos-chromium-extra-channels-code-gpu
  name: Extra Chromium channels code/GPU/Dawn/Shader caches
  description: 'Code Cache, GPUCache, Dawn*, GrShader, Shader for channels not fully
    covered: Chrome Beta/Canary/Dev/for-Testing, Brave Beta/Nightly, Edge Beta/Canary/Dev,
    Opera, Opera GX, Dia, Sidekick.'
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Application Support/Google/Chrome Beta"
  - "$HOME/Library/Application Support/Google/Chrome Canary"
  - "$HOME/Library/Application Support/Google/Chrome Dev"
  - "$HOME/Library/Application Support/Google/Chrome for Testing"
  - "$HOME/Library/Application Support/Google/ChromeForTesting"
  - "$HOME/Library/Application Support/BraveSoftware/Brave-Browser-Beta"
  - "$HOME/Library/Application Support/BraveSoftware/Brave-Browser-Nightly"
  - "$HOME/Library/Application Support/Microsoft Edge Beta"
  - "$HOME/Library/Application Support/Microsoft Edge Canary"
  - "$HOME/Library/Application Support/Microsoft Edge Dev"
  - "$HOME/Library/Application Support/com.operasoftware.Opera"
  - "$HOME/Library/Application Support/com.operasoftware.OperaGX"
  - "$HOME/Library/Application Support/Dia/User Data"
  - "$HOME/Library/Application Support/Sidekick"
  delete_mode: contents
  max_depth: 6
  include_globs:
  - "**/Code Cache/**"
  - "**/GPUCache/**"
  - "**/DawnCache/**"
  - "**/DawnGraphiteCache/**"
  - "**/DawnWebGPUCache/**"
  - "**/GrShaderCache/**"
  - "**/GraphiteDawnCache/**"
  - "**/ShaderCache/**"
  - "**/GPUPersistentCache/**"
- id: macos-chromium-family-http-cache
  name: Chromium-family HTTP caches (Library/Caches)
  description: HTTP/disk caches for Chromium, Brave, Edge, Vivaldi, Opera, Arc, Dia,
    Sidekick under Library/Caches.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/Chromium"
  - "$HOME/Library/Caches/BraveSoftware/Brave-Browser"
  - "$HOME/Library/Caches/BraveSoftware/Brave-Browser-Beta"
  - "$HOME/Library/Caches/BraveSoftware/Brave-Browser-Nightly"
  - "$HOME/Library/Caches/Microsoft Edge"
  - "$HOME/Library/Caches/Microsoft Edge Beta"
  - "$HOME/Library/Caches/Microsoft Edge Canary"
  - "$HOME/Library/Caches/Microsoft Edge Dev"
  - "$HOME/Library/Caches/com.microsoft.edgemac"
  - "$HOME/Library/Caches/com.microsoft.edgemac.beta"
  - "$HOME/Library/Caches/com.microsoft.edgemac.canary"
  - "$HOME/Library/Caches/com.microsoft.edgemac.dev"
