---
pack: browser-cache
description: 'Category pack: browser-cache (54 rules). Add sibling YAML files under
  rules/categories/ to extend.'
rules:
- name: Chrome cache (not profile)
  description: Browser disk cache only; cookies/logins untouched.
  category: browser-cache
  risk: medium
  default_enabled: false
  min_age_days: 7
  delete_mode: contents
  max_depth: 5
  id: app-chrome-cache-macos
  platform: macos
  paths:
  - "$HOME/Library/Caches/Google/Chrome"
  - "$HOME/.cache/google-chrome"
- name: Chrome cache (not profile)
  description: Browser disk cache only; cookies/logins untouched.
  category: browser-cache
  risk: medium
  default_enabled: false
  min_age_days: 7
  delete_mode: contents
  max_depth: 5
  id: app-chrome-cache-linux
  platform: linux
  paths:
  - "$HOME/.cache/google-chrome"
- name: Chrome cache (not profile)
  description: Browser disk cache only; cookies/logins untouched.
  category: browser-cache
  risk: medium
  default_enabled: false
  min_age_days: 7
  delete_mode: contents
  max_depth: 5
  id: app-chrome-cache-windows
  platform: windows
  paths:
  - "%LOCALAPPDATA%/Google/Chrome/User Data/Default/Cache"
  - "%LOCALAPPDATA%/Google/Chrome/User Data/Default/Code Cache"
- id: app-edge-cache
  name: Microsoft Edge cache
  description: Edge Code Cache, GPU cache, and shader cache.
  category: browser-cache
  platform: macos
  risk: medium
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Application Support/Microsoft Edge/Default/Cache"
  - "$HOME/Library/Application Support/Microsoft Edge/Default/Code Cache"
  - "$HOME/Library/Application Support/Microsoft Edge/Default/GPUCache"
  - "$HOME/Library/Application Support/Microsoft Edge/GrShaderCache"
  - "$HOME/Library/Application Support/Microsoft Edge/ShaderCache"
  - "$HOME/Library/Application Support/Microsoft Edge/GraphiteDawnCache"
  - "$HOME/Library/Caches/Microsoft Edge"
  delete_mode: contents
  max_depth: 5
- name: Firefox cache
  description: Firefox cache2 only.
  category: browser-cache
  risk: medium
  default_enabled: false
  min_age_days: 7
  delete_mode: contents
  max_depth: 8
  include_globs: &1
  - "**/cache2/**"
  - "**/startupCache/**"
  id: app-firefox-cache-macos
  platform: macos
  paths:
  - "$HOME/Library/Caches/Firefox"
  - "$HOME/.cache/mozilla/firefox"
- name: Firefox cache
  description: Firefox cache2 only.
  category: browser-cache
  risk: medium
  default_enabled: false
  min_age_days: 7
  delete_mode: contents
  max_depth: 8
  include_globs: *1
  id: app-firefox-cache-linux
  platform: linux
  paths:
  - "$HOME/.cache/mozilla/firefox"
- name: Firefox cache
  description: Firefox cache2 only.
  category: browser-cache
  risk: medium
  default_enabled: false
  min_age_days: 7
  delete_mode: contents
  max_depth: 8
  include_globs: *1
  id: app-firefox-cache-windows
  platform: windows
  paths:
  - "%LOCALAPPDATA%/Mozilla/Firefox/Profiles"
- id: asia-naver-whale-browser-cache
  name: Naver Whale browser caches
  description: Whale Chromium caches under Library/Caches and Application Support
    user data Cache leaves. Not Cookies/Login Data/History.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/com.naver.Whale"
  - "$HOME/Library/Caches/Whale"
  - "$HOME/Library/Application Support/Naver/Whale/Default/Cache"
  - "$HOME/Library/Application Support/Naver/Whale/Default/Code Cache"
  - "$HOME/Library/Application Support/Naver/Whale/Default/GPUCache"
  - "$HOME/Library/Application Support/Naver/Whale/Default/Service Worker"
  - "$HOME/Library/Application Support/Naver/Whale/ShaderCache"
  - "$HOME/Library/Application Support/Naver/Whale/GrShaderCache"
  - "$HOME/Library/Application Support/Naver/Whale/GraphiteDawnCache"
  - "$HOME/Library/Application Support/Whale/Default/Cache"
  - "$HOME/Library/Application Support/Whale/Default/Code Cache"
  - "$HOME/Library/Application Support/Whale/Default/GPUCache"
  - "$HOME/Library/Application Support/Whale/ShaderCache"
  delete_mode: contents
  max_depth: 8
  include_globs:
  - "**/Cache/**"
  - "**/Code Cache/**"
  - "**/GPUCache/**"
  - "**/ShaderCache/**"
  - "**/GrShaderCache/**"
  - "**/GraphiteDawnCache/**"
  - "**/Service Worker/CacheStorage/**"
  exclude_globs:
  - "**/Cookies*"
  - "**/Login Data*"
  - "**/History*"
  - "**/Web Data*"
  - "**/Bookmarks*"
  - "**/Preferences"
- id: cis-yandex-browser-cache-deep
  name: Yandex Browser Chromium caches (deep leaves)
  description: Yandex Browser HTTP/GPU/code/media/Dawn/Service Worker caches under
    Application Support and Library/Caches. Extends base macos-yandex-browser-cache
    with more leaves and channel roots.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/Yandex"
  - "$HOME/Library/Caches/ru.yandex.desktop.yandex-browser"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/Default/Cache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/Default/Code Cache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/Default/GPUCache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/Default/Media Cache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/Default/Service Worker/CacheStorage"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/Default/DawnCache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/Default/DawnGraphiteCache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/Default/DawnWebGPUCache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/ShaderCache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/GrShaderCache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/GraphiteDawnCache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/component_crx_cache"
  - "$HOME/Library/Application Support/Yandex/YandexBrowser/Crashpad"
  delete_mode: contents
  max_depth: 8
  include_globs:
  - "**/Cache/**"
  - "**/Code Cache/**"
  - "**/GPUCache/**"
  - "**/Media Cache/**"
  - "**/DawnCache/**"
  - "**/DawnGraphiteCache/**"
  - "**/DawnWebGPUCache/**"
  - "**/ShaderCache/**"
  - "**/GrShaderCache/**"
  - "**/Service Worker/CacheStorage/**"
  - "**/component_crx_cache/**"
  - "**/Crashpad/**"
  exclude_globs:
  - "**/Cookies*"
  - "**/Login Data*"
  - "**/Web Data*"
  - "**/History*"
  - "**/Bookmarks*"
  - "**/Preferences"
  - "**/Local Storage/**"
  - "**/IndexedDB/**"
  - "**/Sessions/**"
- id: macos-arc-dia-shader-root
  name: Arc and Dia root Graphite/component caches
  description: Browser-root GraphiteDawnCache and component caches for Arc and Dia
    User Data trees.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Application Support/Arc/User Data/GraphiteDawnCache"
  - "$HOME/Library/Application Support/Arc/User Data/GrShaderCache"
  - "$HOME/Library/Application Support/Arc/User Data/ShaderCache"
  - "$HOME/Library/Application Support/Dia/User Data/GraphiteDawnCache"
  - "$HOME/Library/Application Support/Dia/User Data/GrShaderCache"
  - "$HOME/Library/Application Support/Dia/User Data/ShaderCache"
  - "$HOME/Library/Application Support/Dia/User Data/component_crx_cache"
  delete_mode: contents
  max_depth: 3
- id: macos-browser-webkit-shared
  name: Shared WebKit process caches for browsers
  description: Per-bundle-id WebKit directory caches for browsers that use system
    WebKit.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/WebKit/com.apple.Safari"
  - "$HOME/Library/WebKit/com.google.Chrome"
  - "$HOME/Library/WebKit/com.microsoft.edgemac"
  - "$HOME/Library/WebKit/com.brave.Browser"
  - "$HOME/Library/WebKit/com.operasoftware.Opera"
  - "$HOME/Library/WebKit/company.thebrowser.Browser"
  - "$HOME/Library/WebKit/company.thebrowser.dia"
  delete_mode: contents
  max_depth: 4
- id: macos-browserosaurus-caches
  name: Browserosaurus caches and residual state
  description: Browserosaurus (retired browser prompter) caches and Application Support
    residual. Preferences plist left alone when only caches targeted.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/com.browserosaurus"
  - "$HOME/Library/Caches/Browserosaurus"
  - "$HOME/Library/Logs/Browserosaurus"
  - "$HOME/Library/HTTPStorages/com.browserosaurus"
  - "$HOME/Library/Saved Application State/com.browserosaurus.savedState"
  delete_mode: contents
  max_depth: 5
- id: macos-cef-samples-caches
  name: CEF sample and user-data caches
  description: Chromium Embedded Framework default user-data and cefclient/cefsimple
    sample caches on macOS.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 21
  paths:
  - "$HOME/Library/Application Support/CEF"
  - "$HOME/Library/Application Support/CEF/User Data"
  - "$HOME/Library/Application Support/cef_user_data"
  - "$HOME/Library/Application Support/cefclient"
  - "$HOME/Library/Application Support/cefsimple"
  - "$HOME/Library/Caches/CEF"
  - "$HOME/Library/Caches/cef_user_data"
  - "$HOME/Library/Caches/org.cef.cefclient"
  - "$HOME/Library/Caches/org.cef.cefsimple"
  delete_mode: contents
  max_depth: 8
  include_globs:
  - "**/Cache/**"
  - "**/Code Cache/**"
  - "**/GPUCache/**"
  - "**/ShaderCache/**"
  - "**/GrShaderCache/**"
  - "**/DawnCache/**"
  - "**/blob_storage/**"
  exclude_globs:
  - "**/Cookies*"
  - "**/Login Data*"
  - "**/Local Storage/**"
  - "**/IndexedDB/**"
- id: macos-choosy-caches
  name: Choosy caches and HTTP storage
  description: Choosy browser-picker regenerable caches and HTTPStorages. Does not
    remove rules/config under Application Support/Choosy.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/com.choosyosx.Choosy"
  - "$HOME/Library/HTTPStorages/com.choosyosx.Choosy"
  - "$HOME/Library/Logs/Choosy"
  delete_mode: contents
  max_depth: 4
- id: macos-chrome-apps-pwa-residuals
  name: Chrome Apps and installed PWA shortcut residuals
  description: Legacy Chrome Apps.localized trees and channel-local PWA/app shortcut
    bundles under user Applications and Application Support. Regenerable after reinstalling
    PWAs from chrome://apps.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Applications/Chrome Apps.localized"
  - "$HOME/Library/Application Support/Google/Chrome/Chrome Apps.localized"
  - "$HOME/Library/Application Support/Google/Chrome Beta/Chrome Apps.localized"
  - "$HOME/Library/Application Support/Google/Chrome Dev/Chrome Apps.localized"
  - "$HOME/Library/Application Support/Google/Chrome Canary/Chrome Apps.localized"
  - "$HOME/Library/Application Support/Google/Chrome for Testing/Chrome Apps.localized"
  - "$HOME/Library/Application Support/Chromium/Chrome Apps.localized"
  delete_mode: contents
  max_depth: 5
- id: macos-chrome-channels-http-cache
  name: Chrome channel HTTP and code caches (Library/Caches)
  description: Disk HTTP Cache, Code Cache, Media Cache under Library/Caches for Chrome
    stable/beta/dev/canary/for-testing.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/Google/Chrome Beta"
  - "$HOME/Library/Caches/Google/Chrome Canary"
  - "$HOME/Library/Caches/Google/Chrome Dev"
  - "$HOME/Library/Caches/Google/Chrome for Testing"
  - "$HOME/Library/Caches/com.google.Chrome"
  - "$HOME/Library/Caches/com.google.Chrome.beta"
  - "$HOME/Library/Caches/com.google.Chrome.canary"
  - "$HOME/Library/Caches/com.google.Chrome.dev"
  delete_mode: contents
  max_depth: 6
  include_globs:
  - "**/Cache/**"
  - "**/Code Cache/**"
  - "**/Media Cache/**"
  - "**/Storage/**"
- id: macos-chrome-channels-profile-disk-cache
  name: Chrome channel profile HTTP Cache (Application Support)
  description: Per-profile Cache and Media Cache leaves inside Chrome channel user-data
    trees when cache lives under Application Support.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Application Support/Google/Chrome Beta"
  - "$HOME/Library/Application Support/Google/Chrome Canary"
  - "$HOME/Library/Application Support/Google/Chrome Dev"
  - "$HOME/Library/Application Support/Google/Chrome for Testing"
  - "$HOME/Library/Application Support/Google/ChromeForTesting"
  delete_mode: contents
  max_depth: 6
  include_globs:
  - "**/Cache/**"
  - "**/Media Cache/**"
  - "**/Application Cache/**"
  exclude_globs:
  - "**/Cookies*"
  - "**/Login Data*"
  - "**/Web Data*"
  - "**/History*"
  - "**/Bookmarks*"
  - "**/Local Storage/**"
  - "**/Session Storage/**"
  - "**/Sessions/**"
  - "**/IndexedDB/**"
- id: macos-chrome-disk-and-apps-cache
  name: Google Chrome disk cache and Chrome Apps media cache
  description: Chrome browser disk/GPU/shader caches and platform-app related cache
    trees; not profile cookies/logins.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/com.google.Chrome"
  - "$HOME/Library/Caches/com.google.Chrome.helper"
  - "$HOME/Library/Application Support/Google/Chrome/ShaderCache"
  - "$HOME/Library/Application Support/Google/Chrome/GrShaderCache"
  - "$HOME/Library/Application Support/Google/Chrome/GraphiteDawnCache"
  - "$HOME/Library/Application Support/Google/Chrome/Default/GPUCache"
  - "$HOME/Library/Application Support/Google/Chrome/Default/Code Cache"
  - "$HOME/Library/Application Support/Google/Chrome/Default/Service Worker/CacheStorage"
  - "$HOME/Library/Application Support/Google/Chrome/Default/Service Worker/ScriptCache"
  - "$HOME/Library/Application Support/Google/Chrome/Chrome Apps.localized"
  - "$HOME/Applications/Chrome Apps.localized"
  delete_mode: contents
  max_depth: 6
- id: macos-chrome-for-testing-channel-cache
  name: Chrome for Testing channel caches
  description: Chrome for Testing channel HTTP/code caches used by automation stacks
    alongside Playwright/Puppeteer downloads.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/Google/Chrome for Testing"
  - "$HOME/Library/Caches/com.google.chrome.for.testing"
  - "$HOME/Library/Application Support/Google/Chrome for Testing"
  delete_mode: contents
  max_depth: 8
  include_globs:
  - "**/Cache/**"
  - "**/Code Cache/**"
  - "**/GPUCache/**"
  - "**/ShaderCache/**"
  - "**/GrShaderCache/**"
  - "**/GraphiteDawnCache/**"
  - "**/Media Cache/**"
  - "**/component_crx_cache/**"
  exclude_globs:
  - "**/Cookies*"
  - "**/Login Data*"
  - "**/Web Data*"
  - "**/History*"
- id: macos-chrome-helper-caches
  name: Chrome helper and Keystone residual caches
  description: Google Chrome helper process caches and non-profile Keystone agent
    caches (not full updater wipe).
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/com.google.Chrome.helper"
  - "$HOME/Library/Caches/com.google.Chrome.helper.renderer"
  - "$HOME/Library/Caches/com.google.Chrome.helper.plugin"
  - "$HOME/Library/Caches/com.google.Keystone"
  - "$HOME/Library/Caches/com.google.Keystone.Agent"
  - "$HOME/Library/Caches/com.google.GoogleUpdater"
  delete_mode: contents
  max_depth: 4
- id: macos-chromium-code-caches
  name: Chromium-family code and GPU caches
  description: Per-profile regenerable browser caches such as Code Cache, GPUCache,
    and Dawn/Shader caches.
  category: browser-cache
  platform: macos
  risk: medium
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Application Support/Google/Chrome"
  - "$HOME/Library/Application Support/Chromium"
  - "$HOME/Library/Application Support/BraveSoftware/Brave-Browser"
  - "$HOME/Library/Application Support/Microsoft Edge"
  - "$HOME/Library/Application Support/Vivaldi"
  - "$HOME/Library/Application Support/Arc"
  delete_mode: contents
  max_depth: 5
  include_globs:
  - "**/Code Cache/**"
  - "**/GPUCache/**"
  - "**/DawnCache/**"
  - "**/GrShaderCache/**"
  - "**/GraphiteDawnCache/**"
  - "**/ShaderCache/**"
- id: macos-chromium-component-crx-cache
  name: Chromium Component and extension CRX caches
  description: component_crx_cache and extensions_crx_cache holding downloaded component/extension
    package blobs.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Application Support/Google/Chrome/component_crx_cache"
  - "$HOME/Library/Application Support/Google/Chrome/extensions_crx_cache"
  - "$HOME/Library/Application Support/Google/Chrome Beta/component_crx_cache"
  - "$HOME/Library/Application Support/Google/Chrome Canary/component_crx_cache"
  - "$HOME/Library/Application Support/Google/Chrome Dev/component_crx_cache"
  - "$HOME/Library/Application Support/Chromium/component_crx_cache"
  - "$HOME/Library/Application Support/BraveSoftware/Brave-Browser/component_crx_cache"
  - "$HOME/Library/Application Support/Microsoft Edge/component_crx_cache"
  - "$HOME/Library/Application Support/Microsoft Edge/extensions_crx_cache"
  - "$HOME/Library/Application Support/Vivaldi/component_crx_cache"
  - "$HOME/Library/Application Support/Arc/User Data/component_crx_cache"
  - "$HOME/Library/Application Support/Dia/User Data/component_crx_cache"
  - "$HOME/Library/Application Support/com.operasoftware.Opera/component_crx_cache"
  - "$HOME/Library/Application Support/com.operasoftware.OperaGX/component_crx_cache"
  - "$HOME/Library/Application Support/Sidekick/component_crx_cache"
  delete_mode: contents
  max_depth: 3
- id: macos-chromium-crashpad
  name: Chromium-family Crashpad reports
  description: Crashpad completed/pending crash minidumps for Chromium browsers. Safe
    to clear.
  category: browser-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Application Support/Google/Chrome/Crashpad"
  - "$HOME/Library/Application Support/Google/Chrome Beta/Crashpad"
  - "$HOME/Library/Application Support/Google/Chrome Canary/Crashpad"
  - "$HOME/Library/Application Support/Google/Chrome Dev/Crashpad"
  - "$HOME/Library/Application Support/Chromium/Crashpad"
  - "$HOME/Library/Application Support/BraveSoftware/Brave-Browser/Crashpad"
  - "$HOME/Library/Application Support/Microsoft Edge/Crashpad"
  - "$HOME/Library/Application Support/Microsoft Edge Beta/Crashpad"
  - "$HOME/Library/Application Support/Vivaldi/Crashpad"
  - "$HOME/Library/Application Support/Arc/User Data/Crashpad"
  - "$HOME/Library/Application Support/Dia/User Data/Crashpad"
  - "$HOME/Library/Application Support/com.operasoftware.Opera/Crashpad"
  - "$HOME/Library/Application Support/com.operasoftware.OperaGX/Crashpad"
  - "$HOME/Library/Application Support/Sidekick/Crashpad"
  delete_mode: contents
  max_depth: 4
  include_globs:
  - "**/completed/**"
  - "**/pending/**"
  - "**/new/**"
  - "**/attachments/**"
  exclude_globs:
  - "**/settings.dat"
  - "**/client_id"
- id: macos-chromium-dawn-gpu-extra-leaves
  name: Chromium Dawn/WebGPU/GPUPersistent leaves (stable family)
  description: 'Additional GPU-related regenerable leaves under main Chromium-family
