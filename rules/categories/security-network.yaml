---
pack: security-network
description: "VPN clients, proxy tools, zero-trust agents, remote desktop apps, and file transfer utilities caches and logs; VPN profiles, SSH keys, and saved credentials are preserved."
rules:
- id: sn-surfshark-macos
  name: "Surfshark VPN caches and logs"
  description: "Removes regenerable Surfshark VPN caches and logs; VPN profiles, SSH keys, hosts, and saved credentials are preserved."
  category: security-network
  platform: macos
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/Library/Application Support/com.surfshark.vpnclient.macos.direct/logs"
  - "$HOME/Library/Caches/com.surfshark.vpnclient.macos.direct"
  - "$HOME/Library/Logs/Surfshark"
  delete_mode: contents
  max_depth: 5
  tags: [security-network, network, vpn]

- id: sn-surfshark-linux
  name: "Surfshark VPN caches and logs"
  description: "Removes regenerable Surfshark VPN caches and logs; VPN profiles, SSH keys, hosts, and saved credentials are preserved."
  category: security-network
  platform: linux
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/.cache/surfshark"
  - "$HOME/.config/Surfshark/logs"
  delete_mode: contents
  max_depth: 5
  tags: [security-network, network, vpn]

- id: sn-surfshark-windows
