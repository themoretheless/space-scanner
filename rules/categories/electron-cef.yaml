---
pack: electron-cef
description: "Chromium/Electron/CEF desktop productivity, API, database, note-taking, Git, and terminal app caches and logs; local workspaces and databases are preserved."
rules:
- id: ec-postman-macos
  name: "Postman Electron caches and logs"
  description: "Removes regenerable Postman HTTP, Code, GPU, Dawn caches and logs; profiles, local storage, databases, and auth tokens are preserved."
  category: electron-cef
  platform: macos
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/Library/Application Support/Postman/Cache"
  - "$HOME/Library/Application Support/Postman/Code Cache"
  - "$HOME/Library/Application Support/Postman/GPUCache"
  - "$HOME/Library/Application Support/Postman/DawnGraphiteCache"
  - "$HOME/Library/Application Support/Postman/DawnWebGPUCache"
  - "$HOME/Library/Application Support/Postman/GraphiteDawnCache"
  - "$HOME/Library/Application Support/Postman/ShaderCache"
  - "$HOME/Library/Application Support/Postman/logs"
  - "$HOME/Library/Logs/Postman"
  - "$HOME/Library/Caches/Postman"
  - "$HOME/Library/Caches/com.postmanlabs.mac"
  - "$HOME/Library/Caches/com.postmanlabs.mac.ShipIt"
  delete_mode: contents
  max_depth: 5
  tags: [electron-cef, electron]

- id: ec-postman-partitions-macos
  name: "Postman partition caches"
  description: "Removes regenerable Cache, Code Cache, GPUCache, and Dawn caches inside Postman Partitions; profiles, local storage, databases, and auth tokens are preserved."
  category: electron-cef
  platform: macos
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 1
  paths:
  - "$HOME/Library/Application Support/Postman/Partitions"
  include_globs:
  - "*/Cache"
  - "*/Code Cache"
  - "*/GPUCache"
  - "*/DawnGraphiteCache"
  - "*/DawnWebGPUCache"
  match_directories: true
  delete_mode: contents
  max_depth: 3
  tags: [electron-cef, electron]

- id: ec-postman-linux
  name: "Postman Electron caches and logs"
