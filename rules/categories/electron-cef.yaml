  - "$HOME/.config/Postman/Cache"
  - "$HOME/.config/Postman/Code Cache"
  - "$HOME/.config/Postman/GPUCache"
  - "$HOME/.config/Postman/DawnGraphiteCache"
  - "$HOME/.config/Postman/DawnWebGPUCache"
  - "$HOME/.config/Postman/logs"
  - "$HOME/.cache/Postman"
  delete_mode: contents
  max_depth: 5
  tags: [electron-cef, electron]

