---
pack: leftovers
description: 'Category pack: leftovers (580 rules). Add sibling YAML files under rules/categories/
  to extend.'
rules:
- id: apple-preview-autosave-careful
  name: Preview autosave leftovers (careful)
  description: Preview Autosave Information. May hold unsaved document state.
  category: leftovers
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 30
  paths:
  - "$HOME/Library/Containers/com.apple.Preview/Data/Library/Autosave Information"
  delete_mode: contents
  max_depth: 4
- id: apple-textedit-autosave-careful
  name: TextEdit autosave leftovers (careful)
  description: TextEdit Autosave Information and TemporaryItems document stubs.
  category: leftovers
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 30
  paths:
  - "$HOME/Library/Containers/com.apple.TextEdit/Data/Library/Autosave Information"
  - "$TMPDIR/TemporaryItems/(A Document Being Saved By TextEdit)"
  delete_mode: contents
  max_depth: 4
- id: containers-orphaned-saved-state-utils
  name: Utility apps Saved Application State residual
  description: Saved Application State for common utilities (window restore junk).
  category: leftovers
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 30
  paths:
  - "$HOME/Library/Saved Application State/com.apple.calculator.savedState"
  - "$HOME/Library/Saved Application State/com.apple.weather.savedState"
  - "$HOME/Library/Saved Application State/com.apple.stocks.savedState"
