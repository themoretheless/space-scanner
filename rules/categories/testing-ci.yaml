---
pack: testing-ci
description: "E2E headless browser binaries, local CI runners, compiler caches, and linter caches; project source code and CI workflows are preserved."
rules:
- id: tci-playwright-macos
  name: "Playwright downloaded browsers"
  description: "Removes regenerable Playwright downloaded browsers; source repositories, credentials, and test definitions are preserved."
  category: testing-ci
  platform: macos
  risk: medium
  kind: dev
  default_enabled: true
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/ms-playwright"
  - "$HOME/Library/Caches/ms-playwright-go"
  delete_mode: contents
  max_depth: 5
  tags: [testing-ci, testing, browser]

