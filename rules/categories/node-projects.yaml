- id: node-project-build-caches-macos
  name: Node.js framework build caches
  description: Removes regenerable .next/cache, .turbo, .svelte-kit, .nuxt, .parcel-cache, .angular/cache, and .vite directories inside Node.js projects; source files and package.json are preserved.
  category: dev
  platform: macos
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 0
  paths:
  - "$HOME/Projects"
  - "$HOME/Source"
  - "$HOME/Sources"
  - "$HOME/Developer"
  - "$HOME/src"
  - "$HOME/repos"
  - "$HOME/work"
  - "$HOME/workspace"
  - "$HOME/Documents/Projects"
  - "$HOME/Documents/Source"
  - "$HOME/Documents/Sources"
  - "$HOME/RiderProjects"
  - "$HOME/IdeaProjects"
  - "$HOME/WebstormProjects"
  - "$HOME/PycharmProjects"
  - "$HOME/CLionProjects"
  - "$HOME/GolandProjects"
  include_globs:
  - "**/.next/cache"
  - "**/.turbo"
  - "**/.svelte-kit"
  - "**/.nuxt"
  - "**/.parcel-cache"
  - "**/.angular/cache"
  - "**/.vite"
  exclude_globs:
  - "**/.git/**"
  - "**/node_modules/**"
  required_ancestor_globs:
  - "package.json"
  match_directories: true
  delete_mode: contents
  max_depth: 12
  tags: [nodejs, frontend, cache, build-output, project]

