  - "%USERPROFILE%/work"
  - "%USERPROFILE%/workspace"
  - "%USERPROFILE%/Documents/Projects"
  - "%USERPROFILE%/Documents/Source"
  - "%USERPROFILE%/Documents/Sources"
  include_globs:
  - "**/node_modules"
  exclude_globs:
  - "**/.git/**"
  required_ancestor_globs:
  - "package.json"
  match_directories: true
  delete_mode: contents
  max_depth: 16
  tags: [nodejs, npm, dependencies, build-output, project]
