---
pack: app-cache
description: 'Category pack: app-cache (1202 rules). Add sibling YAML files under
  rules/categories/ to extend.'
rules:
- id: alacritty-kitty-caches-logs
  name: Alacritty and Kitty caches and logs
  description: GPU terminal emulator residual caches/logs. Not config files.
  category: app-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/org.alacritty"
  - "$HOME/Library/Caches/alacritty"
  - "$HOME/Library/Logs/alacritty"
  - "$HOME/Library/Caches/net.kovidgoyal.kitty"
  - "$HOME/Library/Caches/kitty"
  - "$HOME/Library/Logs/kitty"
  - "$HOME/Library/Saved Application State/org.alacritty.savedState"
  - "$HOME/Library/Saved Application State/net.kovidgoyal.kitty.savedState"
  delete_mode: contents
  max_depth: 5
- id: app-alfred-cache
  name: Alfred launcher caches
  description: Alfred app and preferences caches (not workflows/snippets).
  category: app-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/com.runningwithcrayons.Alfred"
  - "$HOME/Library/Caches/com.runningwithcrayons.Alfred-Preferences"
  - "$HOME/Library/Application Support/Alfred/Caches"
  - "$HOME/Library/Application Support/Alfred 4/Caches"
  - "$HOME/Library/Application Support/Alfred 5/Caches"
  - "$HOME/Library/Logs/Alfred"
  delete_mode: contents
  max_depth: 6
- id: app-authy-updater-cache
  name: Authy Desktop updater cache only
  description: Authy Desktop ShipIt updater cache. Not token/fsCachedData stores.
  category: app-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/com.authy.authy-mac.ShipIt"
  - "$HOME/Library/Logs/Authy"
  - "$HOME/Library/Logs/Authy Desktop"
  - "$HOME/Library/Logs/com.authy.authy-mac"
  delete_mode: contents
  max_depth: 4
  exclude_globs:
  - "**/fsCachedData/**"
  - "**/Local Storage/**"
  - "**/IndexedDB/**"
  - "**/leveldb/**"
- id: app-bambu-studio-cache
