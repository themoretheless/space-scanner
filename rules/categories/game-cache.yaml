  - "$HOME/Library/Application Support/heroic/GPUCache"
  - "$HOME/Library/Application Support/heroic/store"
  - "$HOME/Library/Application Support/heroic/logs"
  - "$HOME/Library/Caches/heroic"
  - "$HOME/.cache/heroic"
  delete_mode: contents
  max_depth: 6
- id: mac-itch-cache
  name: itch.io app caches and logs
  description: itch desktop app caches/logs. Not apps/ game install library.
  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 5
  paths:
  - "$HOME/Library/Application Support/itch/Cache"
  - "$HOME/Library/Application Support/itch/Code Cache"
  - "$HOME/Library/Application Support/itch/GPUCache"
