  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Application Support/LGHUB/cache"
  - "$HOME/Library/Application Support/LGHUB/logs"
  - "$HOME/Library/Application Support/LGHUB/crashpad"
