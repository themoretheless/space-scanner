---
pack: game-cache
description: 'Category pack: game-cache (24 rules). Add sibling YAML files under rules/categories/
  to extend.'
rules:
- id: mac-battlenet-cache
  name: Battle.net caches and logs ($HOME only)
  description: Battle.net client caches under user Library. Shared Agent under /Users/Shared
    is out of $HOME scope.
  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 5
  paths:
  - "$HOME/Library/Application Support/Battle.net/Cache"
  - "$HOME/Library/Application Support/Battle.net/Logs"
  - "$HOME/Library/Application Support/Battle.net/Errors"
  - "$HOME/Library/Caches/com.blizzard.Battle.net"
  - "$HOME/Library/Caches/com.blizzard.Battle.net.BrowserHelper"
  - "$HOME/Library/Logs/Battle.net"
  delete_mode: contents
  max_depth: 6
- id: mac-epic-launcher-cache
  name: Epic Games Launcher caches
  description: Official Epic launcher webcache and related caches. Not installed games.
  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 5
  paths:
  - "$HOME/Library/Caches/com.epicgames.EpicGamesLauncher"
  - "$HOME/Library/Caches/com.epicgames.EpicGamesLauncher/webcache"
  - "$HOME/Library/Caches/com.epicgames.Portal"
  - "$HOME/Library/Application Support/Epic/EpicGamesLauncher/Data/EMS"
  - "$HOME/Library/Application Support/Epic/EpicGamesLauncher/Data/Cli"
  - "$HOME/Library/Application Support/Epic/EpicGamesLauncher/Intermediate"
  delete_mode: contents
  max_depth: 6
- id: mac-epic-webcache-saved
  name: Epic Saved webcache folders
  description: webcache* folders under EpicGamesLauncher Saved (versioned webcache
    dirs).
  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 5
  paths:
  - "$HOME/Library/Application Support/Epic/EpicGamesLauncher/Saved/webcache"
  - "$HOME/Library/Application Support/Epic/EpicGamesLauncher/Saved/webcache_4147"
  - "$HOME/Library/Application Support/Epic/EpicGamesLauncher/Saved/webcache_4430"
  - "$HOME/Library/Application Support/Epic/EpicGamesLauncher/Saved/webcache_4430_1"
  delete_mode: contents
  max_depth: 6
- id: mac-game-center-cache
  name: Game Center / GameKit caches
  description: Apple Game Center client caches. Regenerable; not iCloud game saves.
  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/GameKit"
  - "$HOME/Library/Caches/com.apple.gamed"
  - "$HOME/Library/Caches/com.apple.gamecenter"
  - "$HOME/Library/Application Support/GameKit"
  delete_mode: contents
  max_depth: 5
- id: mac-gog-galaxy-cache
  name: GOG Galaxy caches and logs
  description: GOG Galaxy client cache/logs; not galaxy-library game installs.
  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 5
  paths:
  - "$HOME/Library/Application Support/GOG.com/Galaxy/cache"
  - "$HOME/Library/Application Support/GOG.com/Galaxy/logs"
  - "$HOME/Library/Application Support/GOG.com/Galaxy/crashdumps"
  - "$HOME/Library/Caches/com.gog.galaxy"
  - "$HOME/Library/Caches/com.gog.galaxy.GalaxySupport"
  - "$HOME/Library/Logs/GOG.com"
  delete_mode: contents
  max_depth: 6
- id: mac-heroic-cache
  name: Heroic Games Launcher caches and logs
  description: Heroic Electron caches, legendary helper cache, game logs. Not installed
    game folders.
  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 5
  paths:
  - "$HOME/Library/Application Support/heroic/Cache"
