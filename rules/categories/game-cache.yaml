  max_depth: 5
- id: mac-lunar-client
  name: Lunar Client caches and logs
  description: Lunar Client (Minecraft) game/launcher caches and logs.
  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/.lunarclient/game-cache"
  - "$HOME/.lunarclient/launcher-cache"
  - "$HOME/.lunarclient/logs"
  - "$HOME/.lunarclient/offline"
  delete_mode: contents
  max_depth: 6
  include_globs:
  - "**/logs/**"
  - "**/game-cache/**"
  - "**/launcher-cache/**"
- id: mac-minecraft-cache-logs
  name: Minecraft logs and web caches
  description: Minecraft launcher logs, crash reports, webcache. Never saves/ or versions/
    installs.
  category: game-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Application Support/minecraft/logs"
  - "$HOME/Library/Application Support/minecraft/crash-reports"
  - "$HOME/Library/Application Support/minecraft/webcache"
  - "$HOME/Library/Application Support/minecraft/webcache2"
  - "$HOME/Library/Application Support/minecraft/.mixin.out"
  - "$HOME/Library/Caches/com.mojang"
  - "$HOME/Library/Caches/net.minecraft"
  - "$HOME/Library/Logs/minecraft"
  delete_mode: contents
  max_depth: 5
  exclude_globs:
  - "**/saves/**"
  - "**/versions/**"
  - "**/resourcepacks/**"
  - "**/shaderpacks/**"
- id: mac-openemu-cache
  name: OpenEmu caches and logs
  description: OpenEmu app caches/logs. Never Game Library, Battery Saves, or Screenshots.
  category: game-cache
