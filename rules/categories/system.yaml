---
pack: system
description: 'Category pack: system (25 rules). Add sibling YAML files under rules/categories/
  to extend.'
rules:
- id: backup-destinations-never-report
  name: Backup destinations and SafetyNet (report-only guard)
  description: Explicit report-only markers so scanners never treat common destination
    patterns as cleanable junk.
  category: system
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 0
  paths:
  - "/Volumes"
  delete_mode: contents
  max_depth: 4
  include_globs:
  - "**/_CCC SafetyNet/**"
  - "**/_CCC Archives/**"
  - "**/Backups.backupdb/**"
  - "**/.SparseBundle/**"
  - "**/*.sparsebundle/**"
  - "**/*.backupbundle/**"
  report_only: true
- id: backup-timemachine-destination-report
  name: Time Machine destination and MobileBackups (report-only)
  description: Legacy MobileBackups and TM-related local hold areas; inventory only.
  category: system
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 0
  paths:
  - "/Volumes/MobileBackups"
  - "/.MobileBackups"
  delete_mode: contents
  max_depth: 3
  report_only: true
- name: SQL/Redis CLI history files (report-only)
  description: mysql, psql, sqlite, litecli, mycli, redis-cli interactive histories.
  category: system
  risk: report-only
  default_enabled: false
  min_age_days: 0
  delete_mode: path
  max_depth: 3
  report_only: true
  id: db-cli-history-report-macos
  platform: macos
  paths:
  - "$HOME/.mysql_history"
  - "$HOME/.psql_history"
  - "$HOME/.sqlite_history"
  - "$HOME/.litecli-history"
  - "$HOME/.mycli-history"
  - "$HOME/.rediscli_history"
  - "$HOME/.python_history"
- name: SQL/Redis CLI history files (report-only)
  description: mysql, psql, sqlite, litecli, mycli, redis-cli interactive histories.
  category: system
  risk: report-only
  default_enabled: false
  min_age_days: 0
  delete_mode: path
  max_depth: 3
  report_only: true
  id: db-cli-history-report-linux
  platform: linux
  paths:
  - "$HOME/.mysql_history"
  - "$HOME/.psql_history"
  - "$HOME/.sqlite_history"
  - "$HOME/.litecli-history"
  - "$HOME/.mycli-history"
  - "$HOME/.rediscli_history"
  - "$HOME/.python_history"
  - "$HOME/.config/litecli"
  - "$HOME/.config/mycli"
  - "$HOME/.config/pgcli"
- id: icons-launchservices-user-residual-report
  name: LaunchServices user residual (report-only)
  description: Per-user LaunchServices databases and quarantine events under Preferences.
  category: system
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 0
  paths:
  - "$HOME/Library/Preferences/com.apple.LaunchServices"
  - "$HOME/Library/Preferences/com.apple.LaunchServices/com.apple.launchservices.secure.plist"
  - "$HOME/Library/Preferences/com.apple.LaunchServices/com.apple.LaunchServices.plist"
  - "$HOME/Library/Preferences/com.apple.LaunchServices/com.apple.LaunchServices.SettingsStore.sql"
  - "$HOME/Library/Preferences/com.apple.LaunchServices.QuarantineEventsV2"
  delete_mode: contents
  max_depth: 3
  report_only: true
- id: macos-fileprovider-cache-careful
  name: FileProvider domain caches (careful)
  description: "Inventories system-managed data for FileProvider domain caches (careful); report only, never deleted."
  category: system
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 30
  paths:
  - "$HOME/Library/Application Support/FileProvider"
  - "$HOME/Library/Caches/com.apple.FileProviderDaemon.AppStoreService"
  - "$HOME/Library/Group Containers/group.com.apple.FileProvider.DomainCaching"
  delete_mode: contents
  max_depth: 8
  include_globs:
  - "**/Caches/**"
  - "**/tmp/**"
  - "**/*.log"
- id: macos-icloud-offline-files-report
  name: iCloud local offline / evictable files (report-only)
  description: "Inventories system-managed data for iCloud local offline / evictable files (report-only); report only, never deleted."
  category: system
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 0
  paths:
  - "$HOME/Library/Application Support/CloudDocs"
  - "$HOME/Library/Caches/CloudKit"
  - "$HOME/Library/Caches/com.apple.bird"
  - "$HOME/Library/Group Containers/com.apple.bird"
  - "$HOME/Library/Group Containers/group.com.apple.CloudDocs"
  delete_mode: contents
  max_depth: 6
  report_only: true
- id: macos-language-modeling-assets
  name: Language modeling and input assets
