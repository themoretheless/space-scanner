---
pack: language-projects
description: Generated marker-gated build and dependency cleanup rules.
rules:
- id: project-python-cache-macos
  name: Python project caches
  description: Removes bytecode and tool caches; Python source, environments, and
    dependency files are preserved.
  category: dev
  platform: macos
  risk: low
  kind: cache
  default_enabled: true
  min_age_days: 0
  paths:
  - "$HOME/Projects"
  - "$HOME/Source"
  - "$HOME/Sources"
  - "$HOME/Developer"
  - "$HOME/src"
  - "$HOME/repos"
  - "$HOME/work"
  - "$HOME/workspace"
  - "$HOME/Documents/Projects"
  - "$HOME/Documents/Source"
  - "$HOME/Documents/Sources"
  include_globs:
  - "**/__pycache__"
  - "**/.pytest_cache"
  - "**/.mypy_cache"
  - "**/.ruff_cache"
  exclude_globs:
  - "**/.git/**"
  - "**/node_modules/**"
  required_ancestor_globs:
  - pyproject.toml
  - setup.py
  - requirements.txt
  - Pipfile
  match_directories: true
  delete_mode: contents
  max_depth: 18
  tags:
  - python-cache
  - build-output
  - project
- id: project-python-env-macos
  name: Python disposable environments
  description: Removes recreatable local virtual/test environments; review first because
    reinstalling dependencies may take time.
  category: dev
  platform: macos
  risk: medium
  kind: packages
  default_enabled: false
  min_age_days: 0
  paths:
  - "$HOME/Projects"
  - "$HOME/Source"
  - "$HOME/Sources"
  - "$HOME/Developer"
  - "$HOME/src"
  - "$HOME/repos"
  - "$HOME/work"
  - "$HOME/workspace"
  - "$HOME/Documents/Projects"
  - "$HOME/Documents/Source"
  - "$HOME/Documents/Sources"
  include_globs:
  - "**/.venv"
  - "**/.tox"
  - "**/.nox"
  exclude_globs:
  - "**/.git/**"
  - "**/node_modules/**"
  required_ancestor_globs:
  - pyproject.toml
  - requirements.txt
  - Pipfile
  - poetry.lock
  - uv.lock
  match_directories: true
  delete_mode: contents
  max_depth: 18
  tags:
  - python-env
  - build-output
  - project
