---
pack: vm-cache
description: 'Category pack: vm-cache (18 rules). Add sibling YAML files under rules/categories/
  to extend.'
rules:
- id: macos-crossover-bottle-cache
  name: CrossOver bottle caches (careful)
  description: "Inventories regenerable virtual-machine cache data for CrossOver bottle caches (careful); report only, never deleted."
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Application Support/CrossOver/Cache"
  - "$HOME/Library/Application Support/CrossOver/Bottles"
  - "$HOME/Library/Caches/com.codeweavers.CrossOver"
  - "$HOME/Library/Logs/CrossOver"
  delete_mode: contents
  max_depth: 10
  include_globs:
  - "**/Cache/**"
  - "**/cxoffice.conf.bak"
  - "**/drive_c/users/*/Temp/**"
  - "**/drive_c/windows/temp/**"
  - "**/Logs/**"
- id: macos-parallels-caches
  name: Parallels caches (not VMs)
  description: "Inventories regenerable virtual-machine cache data for Parallels caches (not VMs); report only, never deleted."
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/com.parallels.desktop.console"
  - "$HOME/Library/Caches/com.parallels.desktop.console.ShipIt"
  - "$HOME/Library/Caches/Parallels Software"
  - "$HOME/Library/Logs/parallels.log"
  - "$HOME/Library/Logs/Parallels"
  - "$HOME/Library/Parallels/Applications Menus"
  - "$HOME/Library/Parallels/Caches"
  delete_mode: contents
  max_depth: 5
- id: macos-utm-caches
  name: UTM caches (not VM images)
  description: "Inventories regenerable virtual-machine cache data for UTM caches (not VM images); report only, never deleted."
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/com.utmapp.UTM"
  - "$HOME/Library/Containers/com.utmapp.UTM/Data/Library/Caches"
  - "$HOME/Library/Logs/UTM"
  delete_mode: contents
  max_depth: 6
- id: macos-vmware-fusion-caches
  name: VMware Fusion caches (not VMs)
  description: "Inventories regenerable virtual-machine cache data for VMware Fusion caches (not VMs); report only, never deleted."
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/com.vmware.fusion"
  - "$HOME/Library/Caches/com.vmware.fusion.ShipIt"
  - "$HOME/Library/Logs/VMware"
  - "$HOME/Library/Logs/VMware Fusion.log"
  - "$HOME/Library/Application Support/VMware Fusion/License Backups"
  delete_mode: contents
  max_depth: 5
- id: macos-windows-app-rdc-caches
  name: Windows App / Remote Desktop caches
  description: "Inventories regenerable virtual-machine cache data for Windows App / Remote Desktop caches; report only, never deleted."
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Containers/com.microsoft.rdc.macos/Data/Library/Caches"
  - "$HOME/Library/Containers/com.microsoft.Windows-App/Data/Library/Caches"
  - "$HOME/Library/Group Containers/UBF8T346G9.com.microsoft.rdc"
  - "$HOME/Library/Caches/com.microsoft.rdc.macos"
  - "$HOME/Library/Logs/Microsoft Remote Desktop"
  delete_mode: contents
  max_depth: 7
  include_globs:
  - "**/Caches/**"
  - "**/Logs/**"
  - "**/*.log"
- id: macos-wine-prefix-cache-careful
  name: Wine prefix temp/cache (careful)
  description: "Inventories regenerable virtual-machine cache data for Wine prefix temp/cache (careful); report only, never deleted."
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.wine"
  - "$HOME/Library/Application Support/Wine"
  delete_mode: contents
  max_depth: 12
  include_globs:
  - "**/drive_c/users/*/Temp/**"
  - "**/drive_c/windows/Temp/**"
  - "**/drive_c/windows/temp/**"
  - "**/.update-timestamp"
  - "**/Cache/**"
- id: virt-lima-download-cache
  name: Lima download cache (not instances)
  description: Standalone Lima image download cache at Library/Caches/lima. Safe to
    clear; re-downloads on next limactl start.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.cache/lima"
  delete_mode: contents
  max_depth: 8
- id: virt-multipass-caches
  name: Multipass image and network caches
  description: Multipass download/network caches. On macOS daemon often stores under
    root Library; user-level caches if present.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/multipass"
  - "$HOME/Library/Caches/multipassd"
  - "$HOME/.cache/multipass"
  - "$HOME/Library/Logs/Multipass"
  - "$HOME/Library/Logs/multipass"
  - "/private/var/root/Library/Caches/multipassd"
  - "/var/root/Library/Caches/multipassd"
  delete_mode: contents
  max_depth: 6
- id: virt-orbstack-logs-caches
  name: OrbStack logs and app caches
  description: OrbStack host logs under ~/.orbstack/log and standard macOS app cache/log
    locations. Not data disks.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/.orbstack/log"
  - "$HOME/Library/Caches/dev.orbstack.OrbStack"
  - "$HOME/Library/Caches/dev.orbstack.OrbStack.ShipIt"
  - "$HOME/Library/Logs/OrbStack"
  - "$HOME/Library/Logs/dev.orbstack.OrbStack"
  - "$HOME/Library/Application Support/OrbStack/logs"
  - "$HOME/Library/HTTPStorages/dev.orbstack.OrbStack"
  delete_mode: contents
  max_depth: 5
- id: virt-parallels-caches-logs
  name: Parallels Desktop caches and logs (deeper)
  description: Parallels host caches, ShipIt, software caches, application menus,
    logs. Not .pvm VMs.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/Parallels Software"
  - "$HOME/Library/Caches/com.parallels.desktop"
  - "$HOME/Library/Logs/parallels-desktop.log"
  - "$HOME/Library/Parallels/Applications Menus"
  - "$HOME/Library/Parallels/Updates"
  delete_mode: contents
  max_depth: 6
- id: virt-podman-desktop-caches-logs
  name: Podman Desktop Electron caches and logs
  description: Podman Desktop GUI logs and Chromium-style caches under Application
    Support. Not podman machine disks.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Logs/Podman Desktop"
  - "$HOME/Library/Application Support/Podman Desktop/Cache"
  - "$HOME/Library/Application Support/Podman Desktop/Code Cache"
  - "$HOME/Library/Application Support/Podman Desktop/GPUCache"
  - "$HOME/Library/Application Support/Podman Desktop/DawnGraphiteCache"
  - "$HOME/Library/Application Support/Podman Desktop/DawnWebGPUCache"
  - "$HOME/Library/Application Support/Podman Desktop/blob_storage"
  - "$HOME/Library/Caches/Podman Desktop"
  - "$HOME/Library/Caches/io.podman_desktop.PodmanDesktop"
  delete_mode: contents
  max_depth: 6
- id: virt-qemu-caches
  name: QEMU host caches
  description: User-level QEMU cache directories when present (Homebrew/standalone).
    Not guest disk files.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/qemu"
  - "$HOME/.cache/qemu"
  - "$HOME/Library/Caches/libvirt"
  - "$HOME/.cache/libvirt"
  delete_mode: contents
  max_depth: 5
- id: virt-rancher-desktop-caches-logs
  name: Rancher Desktop caches and logs
  description: K3s image cache and Rancher Desktop logs. Factory reset keeps cache
    unless --cache; this targets caches/logs only.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/Library/Caches/rancher-desktop"
  - "$HOME/Library/Logs/rancher-desktop"
  - "$HOME/Library/Caches/rancher-desktop/k3s"
  - "$HOME/.rd/bin"
  delete_mode: contents
  max_depth: 6
- id: virt-tart-oci-ipsw-cache
  name: Tart OCI and IPSW cache
  description: Tart remote image cache under ~/.tart/cache (OCIs, IPSWs). VMs under
    vms/ stay report-only.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.tart/cache"
  - "$HOME/.tart/cache/OCIs"
  - "$HOME/.tart/cache/IPSWs"
  delete_mode: contents
  max_depth: 8
- id: virt-utm-caches-logs
  name: UTM caches and logs (not VM images)
  description: UTM app caches including downloaded IPSW restore images under container
    Caches, plus logs.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Containers/com.utmapp.UTM/Data/Library/Logs"
  delete_mode: contents
  max_depth: 6
- name: Vagrant tmp and logs
  description: Vagrant temporary downloads and logs under ~/.vagrant.d. Not boxes.
  category: vm-cache
  risk: report-only
  default_enabled: false
  min_age_days: 14
  delete_mode: contents
  max_depth: 5
  id: virt-vagrant-tmp-logs-macos
  platform: macos
  paths:
  - "$HOME/.vagrant.d/logs"
  - "$HOME/.vagrant.d/data"
- name: Vagrant tmp and logs
  description: Vagrant temporary downloads and logs under ~/.vagrant.d. Not boxes.
  category: vm-cache
  risk: report-only
  default_enabled: false
  min_age_days: 14
  delete_mode: contents
  max_depth: 5
  id: virt-vagrant-tmp-logs-linux
  platform: linux
  paths:
  - "$HOME/.vagrant.d/tmp"
  - "$HOME/.vagrant.d/logs"
  - "$HOME/.vagrant.d/data"
- id: virt-virtualbox-logs-caches
  name: VirtualBox host logs and app caches
  description: VirtualBox service/selector logs and macOS app caches. Regenerable;
    close VirtualBox first.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/VirtualBox"
  - "$HOME/Library/Logs/VirtualBox"
  - "$HOME/Library/Caches/org.virtualbox.app.VirtualBox"
  - "$HOME/Library/Caches/com.oracle.virtualbox"
  - "$HOME/Library/Caches/VirtualBox"
  delete_mode: contents
  max_depth: 5
  include_globs:
  - "**/*.log"
  - "**/*.log.*"
  - "**/VBoxSVC.log*"
  - "**/selectorwindow.log*"
  - "**/VBoxHeadless.log*"
  - "**/Caches/**"
- id: virt-vmware-fusion-caches-logs
  name: VMware Fusion caches and logs
  description: Fusion app caches, ShipIt update cache, host logs, Applications Menu
    cache, license backups.
  category: vm-cache
  platform: macos
  risk: report-only
  default_enabled: false
  min_age_days: 7
  paths:
  - "$HOME/Library/Caches/com.vmware.fusionServices"
  - "$HOME/Library/Logs/VMware Fusion.log"
  - "$HOME/Library/Logs/VMware Fusion"
  - "$HOME/Library/Application Support/VMware Fusion/License Backups"
  - "$HOME/Library/Application Support/VMware Fusion Applications Menu"
  delete_mode: contents
  max_depth: 6
