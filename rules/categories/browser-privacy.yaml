---
pack: browser-privacy
description: Cookies and browsing history (Winapp2 + common browser DBs). Disabled
  unless Settings/Rules Privacy checkboxes are on. Passwords are not included.
rules:
- id: priv-history-1browser-download-history
  name: 1Browser Download History
  description: Browser history from Winapp2.ini. Off unless enabled in Junk rules
    → Privacy.
  category: browser-privacy
  platform: windows
  risk: high
  kind: browser
  default_enabled: false
  min_age_days: 0
  paths:
  - "%LOCALAPPDATA%/1browser/1browser/User Data"
  delete_mode: contents
  max_depth: 8
  tags:
  - history
  - browser
  - privacy
  include_globs:
  - "*"
  - "*/DownloadMetadata"
  - "**/DownloadMetadata"
  - "*/shared_proto_db"
