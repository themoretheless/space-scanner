---
pack: linux
description: Linux junk targets (XDG cache, browsers, apps, package managers). Prefs/manager
  still apply.
rules:
- id: linux-xdg-cache-safe
  name: XDG cache (selected)
  description: Common safe subfolders under ~/.cache (not entire tree).
  category: caches
  platform: linux
  risk: low
  default_enabled: true
  min_age_days: 3
  paths:
  - "$HOME/.cache/thumbnails"
  - "$HOME/.cache/fontconfig"
  - "$HOME/.cache/mesa_shader_cache"
  - "$XDG_CACHE_HOME/thumbnails"
  - "$XDG_CACHE_HOME/fontconfig"
  delete_mode: contents
  max_depth: 5
- id: linux-trash
  name: User Trash files
  description: Freedesktop Trash files/info.
  category: leftovers
  platform: linux
  risk: low
  default_enabled: true
  min_age_days: 14
  paths:
  - "$HOME/.local/share/Trash/files"
  - "$HOME/.local/share/Trash/info"
  delete_mode: contents
  max_depth: 6
- id: linux-var-log-report
  name: "/var/log (report-only)"
  description: System logs — report only; needs root to clean.
  category: logs
  platform: linux
  risk: report-only
  default_enabled: false
  min_age_days: 30
  paths:
  - "/var/log"
  delete_mode: contents
  max_depth: 2
  report_only: true
- id: linux-apt-archives
  name: APT package archives
  description: Downloaded .deb archives (apt clean).
  category: package-cache
  platform: linux
  risk: medium
  default_enabled: false
  min_age_days: 7
  paths:
  - "/var/cache/apt/archives"
  delete_mode: contents
  max_depth: 2
- id: linux-pacman-cache
  name: pacman package cache
  description: Arch pacman package cache.
  category: package-cache
  platform: linux
  risk: medium
  default_enabled: false
  min_age_days: 14
  paths:
  - "/var/cache/pacman/pkg"
  delete_mode: contents
  max_depth: 6
- id: linux-dnf-cache
  name: DNF/YUM cache
  description: Fedora/RHEL package manager caches.
  category: package-cache
  platform: linux
  risk: medium
  default_enabled: false
  min_age_days: 14
  paths:
  - "/var/cache/dnf"
  - "/var/cache/yum"
  delete_mode: contents
  max_depth: 6
- id: linux-snap-cache
  name: Snap user revisions leftover
  description: Snap user common/cache folders.
  category: package-cache
  platform: linux
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/snap"
  delete_mode: contents
  max_depth: 8
  include_globs:
  - "**/common/.cache/**"
  - "**/current/.cache/**"
- id: linux-flatpak-cache
  name: Flatpak user cache
  description: Flatpak app caches under ~/.var/app.
  category: app-cache
  platform: linux
  risk: low
  default_enabled: false
  min_age_days: 14
  paths:
  - "$HOME/.var/app"
  delete_mode: contents
  max_depth: 10
  include_globs:
  - "**/cache/**"
  - "**/Cache/**"
