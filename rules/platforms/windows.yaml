---
pack: windows
description: Windows junk targets (temp, browsers, apps, package managers). Prefs/manager
  still apply.
rules:
- id: win-temp-user
  name: User TEMP
  description: User TEMP / LocalAppData\Temp (age-filtered).
  category: temp
  platform: windows
  risk: low
  default_enabled: true
  min_age_days: 2
  paths:
  - "%TEMP%"
  - "%TMP%"
  - "%LOCALAPPDATA%/Temp"
  delete_mode: contents
  max_depth: 6
- id: win-inet-cache
  name: Windows INetCache
  description: IE/Edge legacy Internet cache.
  category: browser-cache
  platform: windows
  risk: low
  default_enabled: true
  min_age_days: 3
  paths:
  - "%LOCALAPPDATA%/Microsoft/Windows/INetCache"
  delete_mode: contents
  max_depth: 6
- id: win-explorer-thumbcache
  name: Explorer thumbcache
  description: Explorer thumbnail / icon caches under LocalAppData.
  category: caches
  platform: windows
  risk: low
  default_enabled: true
  min_age_days: 7
  paths:
  - "%LOCALAPPDATA%/Microsoft/Windows/Explorer"
  delete_mode: contents
  max_depth: 2
  include_globs:
  - thumbcache_*.db
  - iconcache_*.db
  - "*.db"
- id: win-recent-items
  name: Recent items shortcuts
  description: Recent Documents / CustomDestinations (shortcuts only).
  category: leftovers
  platform: windows
  risk: low
  default_enabled: false
  min_age_days: 30
  paths:
  - "%APPDATA%/Microsoft/Windows/Recent"
  - "%APPDATA%/Microsoft/Windows/Recent/AutomaticDestinations"
  - "%APPDATA%/Microsoft/Windows/Recent/CustomDestinations"
  delete_mode: contents
  max_depth: 3
- id: win-crash-dumps
  name: User crash dumps
  description: LocalAppData CrashDumps.
  category: logs
  platform: windows
  risk: low
  default_enabled: true
  min_age_days: 14
  paths:
  - "%LOCALAPPDATA%/CrashDumps"
  delete_mode: contents
  max_depth: 6
- id: win-wer-report
  name: Windows Error Reporting queue (report)
  description: WER ReportQueue — report-only.
  category: logs
  platform: windows
  risk: report-only
  default_enabled: false
  min_age_days: 14
  paths:
  - "%LOCALAPPDATA%/Microsoft/Windows/WER/ReportQueue"
  - "%PROGRAMDATA%/Microsoft/Windows/WER/ReportQueue"
  delete_mode: contents
  max_depth: 6
  report_only: true
- id: win-delivery-optimization
  name: Delivery Optimization cache
  description: Windows Update Delivery Optimization cache.
  category: caches
  platform: windows
  risk: medium
  default_enabled: false
  min_age_days: 14
  paths:
  - "%WINDIR%/SoftwareDistribution/DeliveryOptimization/Cache"
  - "%LOCALAPPDATA%/Microsoft/Windows/DeliveryOptimization"
  delete_mode: contents
  max_depth: 6
- id: win-software-distribution-download
  name: Windows Update Download folder
  description: SoftwareDistribution\Download (may force re-download of updates).
  category: caches
  platform: windows
  risk: medium
  default_enabled: false
  min_age_days: 14
  paths:
  - "%WINDIR%/SoftwareDistribution/Download"
  delete_mode: contents
  max_depth: 6
- id: win-prefetch-report
  name: Prefetch (report-only)
  description: Prefetch can affect launch analysis; never auto-delete.
  category: system
  platform: windows
  risk: report-only
  default_enabled: false
  min_age_days: 30
  paths:
  - "%WINDIR%/Prefetch"
  - C:/Windows/Prefetch
  delete_mode: contents
  max_depth: 1
  report_only: true
- id: win-windows-old-report
  name: Windows.old (report-only)
  description: Previous Windows install; use Storage Settings / Disk Cleanup.
  category: system
  platform: windows
  risk: report-only
  default_enabled: false
  min_age_days: 0
  paths:
  - C:/Windows.old
  - "%SystemDrive%/Windows.old"
  delete_mode: path
  max_depth: 1
  report_only: true
- id: win-recycle-bin-report
  name: Recycle Bin (report-only)
  description: Does not empty Recycle Bin; awareness only.
  category: leftovers
  platform: windows
  risk: report-only
  default_enabled: false
  min_age_days: 0
  paths:
  - C:/$Recycle.Bin
  - "%SystemDrive%/$Recycle.Bin"
  delete_mode: contents
  max_depth: 2
  report_only: true
